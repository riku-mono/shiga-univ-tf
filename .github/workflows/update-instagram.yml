name: Update Instagram Posts Automatically

on:
  schedule:
    # 毎日 日本時間 7:00 と 21:00 に自動チェックして最新投稿を反映
    - cron: "0 22,12 * * *"
  workflow_dispatch: # GitHub画面から手動でワンクリック実行も可能

permissions:
  contents: write

jobs:
  update-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Instagram post shortcodes
        run: python update_instagram.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --staged --quiet || (git commit -m "chore: Instagram最新投稿データの自動更新" && git push)
